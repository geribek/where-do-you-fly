name: Promote tested image to production
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of an already verified image
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image without rebuilding
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE:verified-$REVISION"

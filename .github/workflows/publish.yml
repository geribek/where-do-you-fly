name: Publish approved Pi image
on:
  workflow_run:
    workflows: [Mock POC checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-pi
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ steps.image.outputs.revision }}
      - name: Smoke test exact ARM64 image without credentials
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/flight-smoke
          printf 'FLIGHT_ENV=mock\n' > /tmp/flight-smoke/.env
          sudo chown -R 10001:10001 /tmp/flight-smoke
          sudo chmod 600 /tmp/flight-smoke/.env
          docker run -d --name flight-smoke --platform linux/arm64 --network host \
            -e FLIGHT_ENV_FILE=/config/.env -v /tmp/flight-smoke:/config "$IMAGE"
          for attempt in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' flight-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Promote tested image to sandbox
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:verified-$REVISION" --tag "$IMAGE:sandbox" "$IMAGE@$DIGEST"
      - if: always()
        run: docker rm -f flight-smoke || true
